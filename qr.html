<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Alberto bar · QR меню</title>
<style>
  :root {
    --bg: #FAFAF9; --card: #FFFFFF; --ink: #1C1917; --muted: #78716C;
    --beer: #92400E; --line: rgba(180, 83, 9, 0.15);
    --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink); font-family: var(--font);
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--line); border-radius: 24px; padding: 32px 28px;
    text-align: center; box-shadow: 0 8px 32px -8px rgba(180, 83, 9, 0.12);
  }
  .eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--beer); font-weight: 700; }
  h1 { margin: 10px 0 4px; font-size: 26px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
  .qr { width: 260px; height: 260px; margin: 0 auto; display: block; }
  .hint { margin-top: 22px; font-size: 16px; font-weight: 600; }
  .hint span { color: var(--beer); }
  .addr { margin-top: 6px; font-size: 13px; color: var(--muted); }
  @media print {
    body { background: #fff; }
    .card { box-shadow: none; border: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Alberto bar</div>
    <h1>Меню и подбор пива</h1>
    <p class="sub">К каждому сету закусок — пиво из карты бара, с описанием вкуса и пирамидой нот. От команды Flavor Tree.</p>
    <img class="qr" src="qr.svg" alt="QR-код меню Alberto bar" width="260" height="260">
    <p class="hint">Наведите камеру телефона на <span>QR-код</span></p>
    <p class="addr">Алматы, ул. Гоголя 144</p>
  </main>
</body>
</html>
